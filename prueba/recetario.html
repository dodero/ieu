<!DOCTYPE html>
<html>
<head>
    <title>Recetario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.5.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados */
        body {
            padding: 20px;
        }

        .receta {
            margin: 20px 0;
        }

        .receta h3 {
            font-size: 24px;
        }

        .receta p {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mt-3">Mi Recetario de Cocina</h1>

        <!-- Formulario para agregar una nueva receta -->
        <form id="receta-form">
            <div class="mb-3">
                <label for="nombre-receta" class="form-label">Nombre de la Receta:</label>
                <input type="text" id="nombre-receta" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="ingredientes" class="form-label">Ingredientes:</label>
                <textarea id="ingredientes" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label for="instrucciones" class="form-label">Instrucciones:</label>
                <textarea id="instrucciones" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Agregar Receta</button>
        </form>

        <!-- Lista de recetas -->
        <h2 class="mt-4">Recetas</h2>
        <div id="lista-recetas" class="mb-3">
            <!-- Aquí se mostrarán las recetas almacenadas -->
        </div>
    </div>

    <script>
        const recetaForm = document.getElementById('receta-form');
        const nombreRecetaInput = document.getElementById('nombre-receta');
        const ingredientesTextarea = document.getElementById('ingredientes');
        const instruccionesTextarea = document.getElementById('instrucciones');
        const listaRecetas = document.getElementById('lista-recetas');

        // Al cargar la página, mostrar las recetas almacenadas en el localStorage
        cargarRecetas();

        recetaForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const nombreReceta = nombreRecetaInput.value;
            const ingredientes = ingredientesTextarea.value;
            const instrucciones = instruccionesTextarea.value;

            if (nombreReceta && ingredientes && instrucciones) {
                // Crear un objeto de receta
                const receta = { nombreReceta, ingredientes, instrucciones };

                // Agregar la receta al localStorage
                agregarReceta(receta);

                // Limpiar el formulario
                nombreRecetaInput.value = '';
                ingredientesTextarea.value = '';
                instruccionesTextarea.value = '';

                // Actualizar la lista de recetas
                cargarRecetas();
            }
        });

        function agregarReceta(receta) {
            // Obtener las recetas existentes del localStorage
            const recetasExistenteString = localStorage.getItem('recetas');
            const recetasExistente = recetasExistenteString ? JSON.parse(recetasExistenteString) : [];

            // Agregar la nueva receta
            recetasExistente.push(receta);

            // Guardar las recetas actualizadas en el localStorage
            localStorage.setItem('recetas', JSON.stringify(recetasExistente));
        }

        function cargarRecetas() {
            // Obtener las recetas del localStorage
            const recetasString = localStorage.getItem('recetas');
            const recetas = recetasString ? JSON.parse(recetasString) : [];

            // Limpiar la lista de recetas
            listaRecetas.innerHTML = '';

            // Mostrar cada receta en la lista
            recetas.forEach(function (receta, index) {
                const div = document.createElement('div');
                div.classList.add('receta');
                div.innerHTML = `
                    <h3>${receta.nombreReceta}</h3>
                    <p><strong>Ingredientes:</strong><br>${receta.ingredientes}</p>
                    <p><strong>Instrucciones:</strong><br>${receta.instrucciones}</p>
                `;
                listaRecetas.appendChild(div);
            });
        }
    </script>
</body>
</html>
